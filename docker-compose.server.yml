services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: rsod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: my_db
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d my_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7
    container_name: rsod-redis
    restart: unless-stopped
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: rsod-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (FastAPI + YOLO)
  backend:
    image: ghcr.io/wxber12/rsod-backend:latest
    container_name: rsod-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: my_db
      DB_USER: my_user
      DB_PASSWORD: 123456
      DB_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_ENDPOINT: 8.229.104.133:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./.rsod_platform:/app/.rsod_platform:ro

  # Frontend (Vue + Nginx)
  frontend:
    image: ghcr.io/wxber12/rsod-frontend:latest
    container_name: rsod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
