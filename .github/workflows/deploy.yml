name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build Frontend Image", "Build Backend Image"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} << 'DEPLOY'
            git config --global --add safe.directory /opt/rsod-web-platform
            cd /opt/rsod-web-platform
            git pull origin main
            docker compose -f docker-compose.server.yml pull
            docker compose -f docker-compose.server.yml up -d
          DEPLOY
